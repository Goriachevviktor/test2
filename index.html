<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Docker Deploy</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Arial, Helvetica, sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: 40px;
        border: 1px solid #d7deea;
        border-radius: 8px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(23, 32, 51, 0.12);
      }

      p {
        margin: 0 0 14px;
        color: #5a6578;
        font-size: 18px;
      }

      h1 {
        margin: 0;
        color: #111827;
        font-size: clamp(36px, 8vw, 72px);
        line-height: 1;
      }

      code {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 12px;
        border-radius: 6px;
        background: #eef2f7;
        color: #243044;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Docker container is running</p>
      <h1>Отлично, у меня получился второй диплом дисплей!</h1>
      <code>docker-hello-world</code>
    </main>
  </body>
</html>
